# Build cache (optional, speeds up builds)
org.gradle.daemon=true
org.gradle.caching=true

# Memory (avoid D8 OOM on large projects)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Proxy (uncomment if needed)
systemProp.http.proxyHost=192.168.8.10
systemProp.http.proxyPort=7777
systemProp.https.proxyHost=192.168.8.10
systemProp.https.proxyPort=7777
